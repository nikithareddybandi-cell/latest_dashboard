<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SVN Dashboard Tool</title>

<style>
body { margin:0; font-family:"Segoe UI"; background:#0b1220; color:#e5e7eb; }
.container { display:flex; }
.sidebar { width:240px; background:#111827; padding:15px; height:100vh; }
.main { flex:1; padding:20px; }

.folder { padding:10px; margin:6px 0; border-radius:8px; cursor:pointer; background:#1f2937; }
.folder:hover { background:#2563eb; }
.active-folder { background:#2563eb; }

.topbar { display:flex; gap:10px; margin-bottom:15px; }
input { padding:10px; border-radius:8px; border:none; background:#1f2937; color:white; }
button { padding:10px; border:none; border-radius:8px; background:#22c55e; color:white; }

.cards { display:grid; grid-template-columns: repeat(5,1fr); gap:15px; }
.card { padding:15px; border-radius:12px; text-align:center; cursor:pointer; background:#111827; }
.active-card { outline:2px solid #2563eb; }

.PASS { border-left:5px solid #22c55e; }
.FAIL { border-left:5px solid #fb923c; }
.ERROR { border-left:5px solid #38bdf8; }
.HALTED { border-left:5px solid #9ca3af; }

table { width:100%; border-collapse:collapse; margin-top:20px; }
th,td { padding:10px; border-bottom:1px solid #1f2937; }

.badge { padding:4px 8px; border-radius:6px; }
.badge.PASS { background:#14532d; color:#22c55e; }
.badge.FAIL { background:#7c2d12; color:#fb923c; }
.badge.ERROR { background:#0c4a6e; color:#38bdf8; }
.badge.HALTED { background:#374151; color:#9ca3af; }

.analysis { width:100%; background:#1f2937; color:white; border:none; padding:5px; }

tr.PASS { background:rgba(34,197,94,0.05); }
tr.FAIL { background:rgba(251,146,60,0.05); }
tr.ERROR { background:rgba(56,189,248,0.05); }
tr.HALTED { background:rgba(156,163,175,0.05); }

</style>
</head>

<body>

<div class="container">

<div class="sidebar">
<h3>Modules</h3>
<div class="folder active-folder" onclick="setFolder('ALL', this)">ALL</div>
<div id="folderList"></div>
</div>

<div class="main">

<form method="POST" class="topbar">
<input name="path" placeholder="Enter SVN Path" style="flex:1;">
<button>Scan</button>
<input id="searchBox" placeholder="Search..." oninput="render()">
</form>

<div class="cards">
<div class="card active-card" onclick="setStatus('ALL', this)">TOTAL <p id="totalCount"></p></div>
<div class="card PASS" onclick="setStatus('PASS', this)">PASS <p id="passCount"></p></div>
<div class="card FAIL" onclick="setStatus('FAIL', this)">FAIL <p id="failCount"></p></div>
<div class="card ERROR" onclick="setStatus('ERROR', this)">ERROR <p id="errorCount"></p></div>
<div class="card HALTED" onclick="setStatus('HALTED', this)">HALTED <p id="haltedCount"></p></div>
</div>

<table>
<thead>
<tr>
<th>File</th>
<th>Module</th>
<th>Date</th>
<th>Total</th>
<th>Pass</th>
<th>Fail</th>
<th>Error</th>
<th>Status</th>
<th>Analysis</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>
</div>

<script>

let DATA = {{ data | tojson }};
let ANALYSIS = {{ analysis | tojson }};

let CURRENT_FOLDER="ALL";
let CURRENT_STATUS="ALL";

function initFolders(){
    let folders=[...new Set(DATA.map(d=>d.module))];
    let html="";
    folders.forEach(f=>{
        html+=`<div class="folder" onclick="setFolder('${f}',this)">${f}</div>`;
    });
    document.getElementById("folderList").innerHTML=html;
}

function setFolder(f,el){
    CURRENT_FOLDER=f;
    document.querySelectorAll(".folder").forEach(x=>x.classList.remove("active-folder"));
    el.classList.add("active-folder");
    render();
}

function setStatus(s,el){
    CURRENT_STATUS=s;
    document.querySelectorAll(".card").forEach(x=>x.classList.remove("active-card"));
    el.classList.add("active-card");
    render();
}

function openLog(path){
    window.open("/open_log?path="+encodeURIComponent(path));
}

function update(path,val){
    ANALYSIS[path]=val;
    fetch("/save_analysis",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(ANALYSIS)});
}

function render(){

    let search=document.getElementById("searchBox").value.toLowerCase();

    let filtered=DATA.filter(d=>
        (CURRENT_FOLDER==="ALL"||d.module===CURRENT_FOLDER)&&
        (CURRENT_STATUS==="ALL"||d.status===CURRENT_STATUS)&&
        d.file.toLowerCase().includes(search)
    );

    filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));

    document.getElementById("totalCount").innerText=DATA.length;
    document.getElementById("passCount").innerText=DATA.filter(d=>d.status==="PASS").length;
    document.getElementById("failCount").innerText=DATA.filter(d=>d.status==="FAIL").length;
    document.getElementById("errorCount").innerText=DATA.filter(d=>d.status==="ERROR").length;
    document.getElementById("haltedCount").innerText=DATA.filter(d=>d.status==="HALTED").length;

    let rows="";

    if(filtered.length===0){
        rows=`<tr><td colspan="9" style="text-align:center;">No logs found</td></tr>`;
    }

    filtered.forEach(d=>{
        let note=ANALYSIS[d.path]||"";

        rows+=`
        <tr class="${d.status}" onclick="openLog(${JSON.stringify(d.path)})">
            <td>${d.file}</td>
            <td>${d.module}</td>
            <td>${d.date}</td>
            <td>${d.total}</td>
            <td>${d.passed}</td>
            <td>${d.failed}</td>
            <td>${d.errors}</td>
            <td><span class="badge ${d.status}">${d.status}</span></td>
            <td>
                <input class="analysis"
                value="${note}"
                onclick="event.stopPropagation()"
                oninput="update('${d.path}',this.value)">
            </td>
        </tr>`;
    });

    document.getElementById("table").innerHTML=rows;
}

window.onload=()=>{initFolders();render();};

</script>

</body>
</html>
